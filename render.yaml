services:
  # -------------------------------------------------------------
  # CivicFlow FastAPI Production Backend Web Service (Render Free)
  # -------------------------------------------------------------
  - type: web
    name: civicflow-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd backend && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard using Supabase Free PostgreSQL connection string
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard using Google AI Studio API key
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        sync: false # Set in Render Dashboard to your Vercel URL, e.g. https://civicflow.vercel.app
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard (e.g. https://xyz.supabase.co)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set in Render Dashboard from Supabase Project Settings -> API
      - key: SUPABASE_STORAGE_BUCKET
        value: complaints
      - key: GEOCODING_USER_AGENT
        value: CivicFlow/1.0 (civicflow-prod@users.noreply.github.com)
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_TIMEOUT_SECONDS
        value: 10
      - key: LOCATION_MISMATCH_THRESHOLD_METERS
        value: 500
